    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M3 9L13 8M22 27L31 26" stroke="#302F2C" stroke-opacity=".035"/></pattern>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".01 .05" numOctaves="1" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
    <clipPath id="clip"><rect width="1200" height="400" rx="30"/></clipPath>
  </defs>
