<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 003</title>
  <desc>Public-issue conceptual black line, pressure points, silent pale space, outward release, and five-language documentation.</desc>
  <defs>
