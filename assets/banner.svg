  <text x="92" y="86" fill="#FCFCF8" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">XXD / IMAGE SKILL</text>
  <text x="70" y="165" fill="#242421" font-family="Arial,sans-serif" font-size="65" font-weight="850" letter-spacing="-2">PANEL <tspan fill="#696964">003</tspan></text>
  <text x="72" y="210" fill="#343431" font-family="Arial,sans-serif" font-size="21" font-weight="800" letter-spacing=".5">CONTINUOUS LINE · PRESSURE · PASSAGE · RELEASE</text>
